[project]
name = "comfyui-coreChecker"
version = "0.1.0"
description = "Custom nodes for ComfyUI providing advanced model architecture checking and dynamic memory guards."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "barrimos" }
]
keywords = ["comfyui", "custom-nodes", "memory-guard", "model-checker", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "psutil"
]

[project.urls]
Repository = "https://github.com/barrimos/ComfyUI-CoreChecker"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["js/*.js", "js/**/*.js"]

# ============================================================
# ComfyUI Node Registry Configuration
# ============================================================
[tool.comfy]
PublisherId = "barrimos"
DisplayName = "ComfyUI-CoreChecker"
Icon = ""
