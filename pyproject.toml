[project]
name = "corechecker"
Version = "1.1.0"
description = "Custom nodes for ComfyUI providing advanced model architecture checking and dynamic memory guards, Optimization workflows through smart conditional logic and system resource awareness."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "barrimos" }
]

# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]
dependencies = ["psutil"]

[project.urls]
Repository = "https://github.com/barrimos/ComfyUI-CoreChecker"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/barrimos/ComfyUI-CoreChecker/wiki"
"Bug Tracker" = "https://github.com/barrimos/ComfyUI-CoreChecker/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["js/*.js", "js/**/*.js"]

[tool.comfy]
PublisherId = "barrimos"
DisplayName = "ComfyUI-CoreChecker"
Icon = ""
includes = []
# "requires-comfyui" = ">=1.0.0"  # ComfyUI version compatibility
